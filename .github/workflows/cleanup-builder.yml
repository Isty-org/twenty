name: Remove temporary Twenty builder
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: [self-hosted, linux, x64, isty-ci]
    timeout-minutes: 5
    steps:
      - name: Remove only the builder created by Twenty run 37515446918
        run: |
          container=buildx_buildkit_builder-f8665300-01bc-4c3e-bd3a-1e7c09718c390
          volume=buildx_buildkit_builder-f8665300-01bc-4c3e-bd3a-1e7c09718c390_state
          if docker container inspect "$container" >/dev/null 2>&1; then
            docker container rm -f "$container"
          fi
          if docker volume inspect "$volume" >/dev/null 2>&1; then
            docker volume rm "$volume"
          fi
