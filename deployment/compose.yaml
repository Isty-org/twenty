name: isty-twenty

x-environment: &environment
  NODE_PORT: 3000
  NODE_OPTIONS: --max-old-space-size=768
  PG_DATABASE_URL: postgres://twenty:${PG_DATABASE_PASSWORD}@db:5432/twenty
  SERVER_URL: https://twenty.isty.ist
  REDIS_URL: redis://redis:6379
  STORAGE_TYPE: local
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  APP_SECRET: ${APP_SECRET}
  TELEMETRY_ENABLED: "false"
  SIGN_UP_DISABLED: ${SIGN_UP_DISABLED:-false}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  server:
    image: ${TWENTY_IMAGE:-twentycrm/twenty:v2.45.0}
    restart: unless-stopped
    mem_limit: 1152m
    cpus: 1.0
    environment: *environment
    volumes:
      - storage:/app/packages/twenty-server/.local-storage
    ports:
      - 127.0.0.1:13020:3000
    networks:
      default:
      proxy:
        aliases: [isty-twenty-server]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:3000/healthz]
      interval: 20s
      timeout: 10s
      start_period: 120s
      retries: 30
    logging: *logging
  worker:
    image: ${TWENTY_IMAGE:-twentycrm/twenty:v2.45.0}
    command: [yarn, "worker:prod"]
    restart: unless-stopped
    mem_limit: 1152m
    cpus: 0.75
    environment:
      <<: *environment
      NODE_OPTIONS: --max-old-space-size=768
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - storage:/app/packages/twenty-server/.local-storage
    depends_on:
      server: {condition: service_healthy}
    logging: *logging
  db:
    image: postgres:16.14-bookworm
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    environment:
      POSTGRES_USER: twenty
      POSTGRES_DB: twenty
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U twenty -d twenty"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    command: [redis-server, --maxmemory, 96mb, --maxmemory-policy, noeviction, --appendonly, "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

volumes:
  database:
  storage:
  redis:

networks:
  proxy:
    external: true
    name: root_walldenet
